[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-shared"
version = "0.1.0"
description = "Contratos (schemas Pydantic) compartilhados entre backend e worker."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
