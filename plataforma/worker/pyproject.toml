[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-worker"
version = "0.1.0"
description = "Worker da plataforma (PC com GPU): conecta a máquina pessoal (LM Studio/Ollama) ao Gateway via WebSocket."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "agent-shared",
    "websockets>=13.0,<14.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
]

[project.optional-dependencies]
voz = ["faster-whisper>=1.0", "av<16", "piper-tts>=1.2", "kokoro-onnx>=0.4"]
# Libs CUDA (pip) para o Whisper na GPU; as mesmas versões da esteira (`uv sync --extra voz --extra voz-gpu`).
voz-gpu = ["nvidia-cublas-cu12==12.9.2.10", "nvidia-cudnn-cu12==9.27.0.42"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.uv.sources]
agent-shared = { workspace = true }
