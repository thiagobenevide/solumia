[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-backend"
version = "0.1.0"
description = "Backend da plataforma (VPS): OpenAI-compatible gateway that routes requests to remote LLM workers over WebSocket."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "agent-shared",
    "agent-saude",
    "agent-estudos",
    "agent-rotinas",
    "agent-concursos",
    "agent-design",
    "agent-eletronica",
    "agent-codigo",
    "agent-financas",
    "agent-painel",
    "agent-youtube",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.uv.sources]
agent-shared = { workspace = true }
agent-saude = { workspace = true }
agent-estudos = { workspace = true }
agent-rotinas = { workspace = true }
agent-concursos = { workspace = true }
agent-design = { workspace = true }
agent-eletronica = { workspace = true }
agent-codigo = { workspace = true }
agent-financas = { workspace = true }
agent-painel = { workspace = true }
agent-youtube = { workspace = true }
