services:
  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/backend/Dockerfile
    image: llm-gateway/gateway:dev
    env_file:
      - path: ../../plataforma/backend/.env
        required: false
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 48080
      # The VPS runs on UTC; the code uses local time as Brasília time (calendar, quotes,
      # "today" in prompts, notes).
      TZ: America/Sao_Paulo
    ports:
      # Published only on localhost: in production external traffic comes in through
      # nginx (80/443); the gateway must not be reachable directly from the internet.
      - "127.0.0.1:48080:48080"
    volumes:
      # Notes and the file library (annotations included) survive container recreation.
      - agent-data:/home/gateway/agent-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:48080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Reverse SSH tunnel: the PC publishes the esteira here (infra/scripts/conectar_vps). nginx serves it at
  # /esteira/ only with the login token; 18765 on localhost is for the host nginx (Scenario B).
  tunel:
    build: ./tunel
    image: agent/tunel:dev
    ports:
      - "${TUNEL_PORTA:-2222}:2222"
      - "127.0.0.1:18765:8765"
    volumes:
      - ./tunel/authorized_keys:/config/authorized_keys:ro
      - tunel-chaves:/etc/ssh/chaves
    restart: unless-stopped

  # Collabora Online (CODE): edits DOCX/XLSX/PPTX in the app via WOPI, with the gateway as host.
  # nginx serves /browser, /hosting/* and /cool/ on the same domain; the gateway needs
  # GATEWAY_COLLABORA_URL=https://<domain>, GATEWAY_COLLABORA_INTERNO_URL=http://collabora:9980,
  # GATEWAY_WOPI_BASE_URL=http://gateway:48080 and GATEWAY_WOPI_SECRET in .env.
  collabora:
    # Pinned version (digest) written by instalar_vps to infra/docker/imagens.env.
    image: ${COLLABORA_IMAGEM:-collabora/code:latest}
    cap_add:
      - MKNOD
    environment:
      # Only accepts WOPISrc from the gateway (internal compose network).
      aliasgroup1: http://gateway:48080
      # TLS ends at nginx; Collabora speaks HTTP inside.
      extra_params: --o:ssl.enable=false --o:ssl.termination=true
      server_name: ${COLLABORA_DOMINIO:-}
      dictionaries: pt_BR en_US
      username: ${COLLABORA_ADMIN_USUARIO:-admin}
      password: ${COLLABORA_ADMIN_SENHA:-}
    ports:
      # Only for the host nginx (Scenario B); the compose nginx uses collabora:9980.
      - "127.0.0.1:9980:9980"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - gateway
      - tunel
      - collabora
    # Reloads every 6h to pick up the certificate renewed by the `certbot` service.
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The real nginx.conf (with your domain) is not committed — see
      # infra/docker/nginx/nginx.conf.example to generate yours.
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Real IP behind Cloudflare and login rate limit (http context, before the site).
      - ./nginx/seguranca-http.conf:/etc/nginx/conf.d/00-seguranca.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-etc:/etc/letsencrypt:ro
    restart: unless-stopped

  certbot:
    image: ${CERTBOT_IMAGEM:-certbot/certbot:latest}
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-etc:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"

volumes:
  agent-data:
  certbot-www:
  certbot-etc:
  tunel-chaves:
