[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-eletronica"
version = "0.1.0"
description = "Backend do módulo Eletrônica: projetos de circuito (esquemático), biblioteca de símbolos (base e KiCad), netlist e lista de peças."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/electronics"]
