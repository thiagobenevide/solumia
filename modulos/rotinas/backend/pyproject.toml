[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-rotinas"
version = "0.1.0"
description = "Backend do módulo Rotinas: Kanban de tarefas, temporizador por tarefa e perguntas ao LLM."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/routines"]
