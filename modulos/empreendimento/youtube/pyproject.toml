[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-youtube"
version = "0.1.0"
description = "YouTube channels backend (Empreendimento): channels, themes, stories, scripts, plans and methods as vault notes."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/youtube"]
