[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-design"
version = "0.1.0"
description = "Backend do módulo Design: quadros brancos com traços vetoriais (pressão da caneta), formas e textos."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/design"]
