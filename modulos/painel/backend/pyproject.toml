[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-painel"
version = "0.1.0"
description = "Backend do módulo Painel: cobrador de metas e agenda do dia, alertas de desvio e chat (LLM local ou Claude)."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.3",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "python-multipart>=0.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/painel"]
