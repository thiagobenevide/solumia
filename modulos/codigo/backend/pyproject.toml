[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-codigo"
version = "0.1.0"
description = "Backend do módulo Código: pedidos de implementação ao Claude Code que roda no PC, em abas, com etapas ao vivo."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coding"]
