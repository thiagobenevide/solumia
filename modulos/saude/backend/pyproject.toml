[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-saude"
version = "0.1.0"
description = "Backend do módulo Saúde: catálogo de exercícios, agenda de treinos e registro de performance."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "python-multipart>=0.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/saude"]
