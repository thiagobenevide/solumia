# Solumia app release: push a tag vX.Y.Z and this builds, signs and publishes the files the
# configurator downloads (configurador/core/src/solumia_configurador/solumia_apps.py):
#   solumia-X.Y.Z-android.apk, solumia-X.Y.Z-wear.apk, solumia-X.Y.Z-linux-x86_64.AppImage,
#   SHA256SUMS.txt, SHA256SUMS.txt.asc (detached GPG signature) and release-signing-key.asc.
#   solumia-X.Y.Z-windows-x64-setup.exe and solumia-configurador-X.Y.Z-windows-x64-setup.exe
#   (configurator interface + core built with PyInstaller in nucleo/; installer: infra/windows/setup.iss).
#
# Repository secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   RELEASE_GPG_PRIVATE_KEY (armored), RELEASE_GPG_PASSPHRASE
# Repository variable:
#   RELEASE_GPG_FINGERPRINT (40 hex chars; the same value pinned in SOLUMIA_FINGERPRINTS)
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.8"
  # Server the apps connect to (repository variable SOLUMIA_URL overrides it).
  SOLUMIA_URL: ${{ vars.SOLUMIA_URL || 'https://solumialocal.thiagobenevide.com' }}

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Version from tag
        # Build number from the version (X.Y.Z -> X*10000 + Y*100 + Z): the same rule as
        # infra/scripts/release_local, so Android never sees a lower number on update.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # A debug-signed APK could not update the installed app later: never publish one.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > plataforma/app/android/key.properties
      - run: flutter pub get
      - name: Build APK
        working-directory: plataforma/app
        run: |
          flutter build apk --release --build-name "$VERSION" --build-number "$BUILD_NUMBER" \
            --dart-define=API_URL="$SOLUMIA_URL" --dart-define=BUILD="$BUILD_NUMBER"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/solumia-$VERSION-android.apk"
      - name: Build watch APK
        working-directory: modulos/saude/wear
        run: |
          cp ../../../plataforma/app/android/key.properties key.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew -q assembleRelease -Pbuild="$BUILD_NUMBER" -PversionName="$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/solumia-$VERSION-wear.apk"
      - name: Remove keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.jks" plataforma/app/android/key.properties \
            modulos/saude/wear/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev \
            libsecret-1-dev libmpv-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libfuse2 file
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Version from tag
        # Build number from the version (X.Y.Z -> X*10000 + Y*100 + Z): the same rule as
        # infra/scripts/release_local, so Android never sees a lower number on update.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Build Linux bundle
        working-directory: plataforma/app
        run: |
          flutter build linux --release --build-name "$VERSION" --build-number "$BUILD_NUMBER" \
            --dart-define=API_URL="$SOLUMIA_URL" --dart-define=BUILD="$BUILD_NUMBER"
      - name: Package AppImage
        run: |
          appdir="$RUNNER_TEMP/Solumia.AppDir"
          mkdir -p "$appdir/usr/bin"
          cp -r plataforma/app/build/linux/x64/release/bundle/. "$appdir/usr/bin/"
          cp plataforma/app/assets/logo.png "$appdir/solumia.png"
          cat > "$appdir/solumia.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Solumia
          Exec=agent
          Icon=solumia
          Categories=Office;
          EOF
          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/agent" "$@"
          EOF
          chmod +x "$appdir/AppRun"
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          mkdir -p dist
          ARCH=x86_64 "$RUNNER_TEMP/appimagetool" --appimage-extract-and-run "$appdir" \
            "dist/solumia-$VERSION-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"
      - name: Inno Setup
        run: |
          if ! command -v iscc >/dev/null && [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi
          echo "/c/Program Files (x86)/Inno Setup 6" >> "$GITHUB_PATH"
      - run: flutter pub get
      - name: Build app
        working-directory: plataforma/app
        run: |
          flutter build windows --release --build-name "$VERSION" --build-number "$BUILD_NUMBER" \
            --dart-define=API_URL="$SOLUMIA_URL" --dart-define=BUILD="$BUILD_NUMBER"
      - name: Build configurator interface
        working-directory: configurador/app
        run: |
          flutter pub get
          flutter build windows --release --build-name "$VERSION" --build-number "$BUILD_NUMBER"
      - name: Build configurator core
        # One folder next to the interface: core.dart looks for nucleo/solumia-configurador.exe.
        run: |
          python -m pip install -q ./configurador/core pyinstaller
          python -m PyInstaller --noconfirm --clean --onedir --console \
            --name solumia-configurador --distpath "$RUNNER_TEMP/core" --workpath "$RUNNER_TEMP/pyi" \
            --collect-submodules uvicorn --collect-submodules keyring --copy-metadata keyring \
            --collect-submodules solumia_configurador infra/windows/configurator_core.py
          release=configurador/app/build/windows/x64/runner/Release
          cp -r "$RUNNER_TEMP/core/solumia-configurador" "$release/nucleo"
          "$release/nucleo/solumia-configurador.exe" --help > /dev/null
      - name: Installers
        working-directory: infra/windows
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          dist="$(cygpath -w "$GITHUB_WORKSPACE/dist")"
          iscc //Q //DAppId=solumia //DAppName=Solumia //DAppExe=agent.exe //DAppVersion="$VERSION" \
            //DSourceDir="$(cygpath -w "$GITHUB_WORKSPACE/plataforma/app/build/windows/x64/runner/Release")" \
            //DOutputDir="$dist" //DOutputBase="solumia-$VERSION-windows-x64-setup" setup.iss
          iscc //Q //DAppId=solumia-configurador "//DAppName=Solumia Configurador" \
            //DAppExe=solumia_configurador.exe //DAppVersion="$VERSION" \
            //DSourceDir="$(cygpath -w "$GITHUB_WORKSPACE/configurador/app/build/windows/x64/runner/Release")" \
            //DOutputDir="$dist" //DOutputBase="solumia-configurador-$VERSION-windows-x64-setup" setup.iss
          ls -la "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  publish:
    needs: [android, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and signature
        working-directory: dist
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          GPG_FINGERPRINT: ${{ vars.RELEASE_GPG_FINGERPRINT }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_FINGERPRINT" ]; then
            echo "::error::RELEASE_GPG_PRIVATE_KEY or RELEASE_GPG_FINGERPRINT is not set"; exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          # The imported key must be the pinned one, otherwise the configurator rejects the release.
          imported=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr"{print $10; exit}')
          if [ "$imported" != "$GPG_FINGERPRINT" ]; then
            echo "::error::imported key $imported differs from RELEASE_GPG_FINGERPRINT"; exit 1
          fi
          sha256sum solumia-* > SHA256SUMS.txt
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --local-user "$GPG_FINGERPRINT" --armor --detach-sign --output SHA256SUMS.txt.asc SHA256SUMS.txt
          gpg --batch --armor --export "$GPG_FINGERPRINT" > release-signing-key.asc
          gpg --batch --verify SHA256SUMS.txt.asc SHA256SUMS.txt
          rm -rf "$GNUPGHOME"
          cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "Solumia ${GITHUB_REF_NAME#v}" --generate-notes
